name: Publish

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    id-token: write # required for npm trusted publishing (OIDC) and provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: npm

            # Trusted publishing needs npm 11.5.1 or newer.
            - run: npm install -g npm@latest

            - name: Check tag matches package.json version
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  PKG_VERSION="$(node -p "require('./package.json').version")"
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                      echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
                      exit 1
                  fi

            - run: npm ci

            # prepublishOnly runs the build and tests before anything is uploaded.
            - run: npm publish --provenance --access public
